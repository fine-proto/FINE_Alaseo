<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>FINE Alaseo · 앱 프로토타입</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<style>
/* ================= Base ================= */
:root{--brand:#E96E0A;--orange:#EA580C;--ink:#20262D;--ink2:#191B1F;--sub:#626B76;--sub2:#8A939E;--sec:#4D5C70;--line:#DDE1E6;--line2:#E6E8EC;--page:#F5F6F8;--bg2:#F4F6FB;--peach:#FFF0E4;--peach2:#FFF4EC;--green:#216E4D;--greenbg:#E5F5ED;--blue:#335EA6;--bluebg:#E8F0FF;--red:#D92D20;--redbg:#FDE2E2;--purple:#7A45D6;--purplebg:#F1EBFC}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Noto Sans KR","Noto Sans CJK KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:#E4E7EC;color:var(--ink);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
.stage{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
.device{width:399px;height:836px;padding:12px;border-radius:60px;background:#111318;box-shadow:0 30px 80px rgba(17,19,24,.35),inset 0 0 0 2px #2a2d33}
.screen{width:375px;height:812px;border-radius:48px;position:relative;overflow:hidden;background:var(--page)}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:120px;height:34px;background:#000;border-radius:999px;z-index:300}
.hindi{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:999px;background:#000;z-index:300}
@media (max-width:440px){body{background:var(--page)}.stage{padding:0}.device{width:100vw;height:100dvh;padding:0;border-radius:0;box-shadow:none;background:transparent}.screen{width:100vw;height:100dvh;border-radius:0}.island,.hindi{display:none}}
.noscroll::-webkit-scrollbar{display:none}.noscroll{scrollbar-width:none}

/* ================= Pages ================= */
.page{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--page);padding-top:47px}
@media (max-width:440px){.page{padding-top:env(safe-area-inset-top,0px)}}
.page.enter{animation:pin .26s cubic-bezier(.2,.8,.2,1)}
.page.enter-back{animation:pback .22s ease-out}
.page.fade{animation:fadein .18s ease-out}
@keyframes pin{from{transform:translateX(30%);opacity:.4}to{transform:none;opacity:1}}
@keyframes pback{from{transform:translateX(-12%);opacity:.6}to{transform:none;opacity:1}}
@keyframes fadein{from{opacity:.4}to{opacity:1}}
.page.white{background:#fff}.page.gray{background:var(--bg2)}
.body{flex:1;overflow-y:auto;overscroll-behavior:contain}
.body.tabpad{padding-bottom:104px}
.hdr{height:52px;display:flex;align-items:center;gap:8px;padding:0 16px;flex-shrink:0;background:inherit}
.hdr .title{font-size:17px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:4px}
.hdr .title svg{flex-shrink:0;display:inline-block}
.hdr .backb{width:28px;height:28px;display:flex;align-items:center;justify-content:center;margin-left:-4px}
.hdr .rt{font-size:14px;color:var(--sub);font-weight:500}
.hdr.big .title{font-size:20px;font-weight:900}
.pad{padding:16px}
.sec-title{font-size:18px;font-weight:700;color:var(--sec);margin:4px 0 4px}
.card{background:#fff;border-radius:16px}
.row{display:flex;align-items:center;gap:12px}
.list-row{display:flex;align-items:center;gap:14px;padding:16px;border-bottom:1px solid var(--line2);background:#fff;cursor:pointer}
.list-row:last-child{border-bottom:0}
.muted{color:var(--sub)}.small{font-size:12px}.bold{font-weight:700}
.chev{color:#9AA1AB;font-size:18px}
.tap{cursor:pointer;transition:transform .12s,background .12s}.tap:active{transform:scale(.98)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:12px 16px 8px}
.chip{flex-shrink:0;font-size:13px;padding:7px 13px;border-radius:999px;background:#fff;border:1px solid var(--line);color:var(--sec);cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:700}
.pill{display:inline-flex;align-items:center;font-size:11px;font-weight:700;border-radius:999px;padding:3px 9px;white-space:nowrap}
.p-ing{background:var(--bluebg);color:var(--blue)}.p-done{background:var(--greenbg);color:var(--green)}.p-req{background:#EEF0F3;color:var(--sec)}.p-warn{background:var(--peach);color:var(--orange)}
.btn{display:flex;align-items:center;justify-content:center;height:51px;border-radius:12px;font-size:16px;font-weight:700;width:100%}
.btn-primary{background:var(--orange);color:#fff}.btn-primary:disabled{background:#D5D9DF;color:#fff}
.btn-sub{background:#fff;border:1px solid #CDD2D9;color:var(--ink)}
.btn-sm{height:34px;padding:0 12px;border:1px solid #CDD2D9;border-radius:8px;font-size:13px;background:#fff;white-space:nowrap}
.bottom-cta{padding:12px 16px 28px;background:#fff;border-top:1px solid var(--line2);flex-shrink:0}
.thumb{width:70px;height:70px;border-radius:10px;background:#E1E3E7;flex-shrink:0}
.vthumb{width:64px;height:64px;border-radius:9px;flex-shrink:0;position:relative;overflow:hidden;background:radial-gradient(circle at 32% 64%,rgba(255,60,60,.9) 0 3px,transparent 4px),radial-gradient(circle at 68% 64%,rgba(255,60,60,.9) 0 3px,transparent 4px),radial-gradient(ellipse at 50% 62%,#c9ccd2 0 14px,transparent 15px),linear-gradient(180deg,#1b2333,#2b3346 55%,#3a3f4a)}
.vthumb b{position:absolute;left:5px;bottom:3px;font-size:9px;color:#fff}
.field{display:flex;flex-direction:column;gap:8px;margin-bottom:22px}
.field label{font-size:13px;font-weight:700}
.input{height:50px;border-radius:12px;background:#fff;border:1px solid var(--line);padding:0 14px;font-size:15px;outline:none;width:100%}
.input:focus,textarea:focus{border-color:var(--brand)}
textarea.input{height:120px;padding:14px;resize:none;line-height:1.5}
.badge-add{width:64px;height:64px;border-radius:12px;background:#E9ECF1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:var(--sub);gap:2px;cursor:pointer;flex-shrink:0}
.intro{margin:12px 16px;border-radius:12px;background:var(--peach2);padding:14px 16px;display:flex;gap:12px}
.intro .ic{width:32px;height:32px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.intro b{font-size:14px;display:block;margin-bottom:3px}.intro p{font-size:12.5px;color:var(--sub);line-height:18px}
.note{font-size:12px;color:var(--sub);text-align:center;line-height:18px;padding:16px}
.empty{padding:60px 16px;text-align:center;color:var(--sub);font-size:14px}

/* ================= Tab bar ================= */
.tabbar{position:absolute;left:0;right:0;bottom:0;z-index:150;padding:8px 12px 20px;pointer-events:none;display:none}
.tabbar.show{display:block}
.tabbar .wrap{pointer-events:auto;height:64px;border-radius:999px;padding:1px;background:linear-gradient(#fff,rgba(255,255,255,0) 55%),rgba(255,255,255,.35);box-shadow:0 6px 24px rgba(32,38,45,.08)}
.tabbar .inner{height:62px;border-radius:999px;background:rgba(255,255,255,.94);display:flex;align-items:center;padding:0 3px}
.tabbar .t{flex:1;height:54px;border-radius:999px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;color:var(--sub);font-weight:500;cursor:pointer}
.tabbar .t.on{background:rgba(229,231,235,.85);color:var(--ink);font-weight:900}
.tabbar .t svg{stroke:#626B76}.tabbar .t.on svg{stroke:#111}

/* ================= Overlay / modal / sheet / toast ================= */
.dim{position:absolute;inset:0;background:rgba(17,19,24,.45);z-index:200;display:flex;align-items:center;justify-content:center;padding:18px;animation:fadein .15s}
.dim.sheet{align-items:flex-end;padding:0}
.modal{width:100%;max-width:340px;background:#fff;border-radius:20px;padding:24px 20px 20px;text-align:center}
.modal h3{font-size:17px;font-weight:700;margin-bottom:12px}
.modal .q{font-size:15px;margin-bottom:6px}
.modal .b{font-size:13.5px;color:var(--sub);line-height:20px;margin-bottom:20px;text-align:left}
.modal .btns{display:flex;gap:8px}
.modal .btns button{flex:1;height:48px;border-radius:12px;font-weight:700;font-size:15px}
.mb-cancel{background:var(--bg2);border:1px solid #C9CED6!important}
.mb-ok{background:var(--orange);color:#fff}.mb-danger{background:#DC2626;color:#fff}
.sheetbox{width:100%;background:#fff;border-radius:20px 20px 0 0;padding:10px 0 28px;animation:up .22s cubic-bezier(.2,.8,.2,1);max-height:80%;overflow:auto}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sheetbox .grab{width:40px;height:4px;border-radius:9px;background:#D5D9DF;margin:0 auto 12px}
.sheetbox h3{font-size:17px;font-weight:700;padding:4px 20px 12px}
.toast{position:absolute;left:50%;bottom:120px;transform:translate(-50%,8px);background:rgba(32,38,45,.92);color:#fff;font-size:13px;padding:11px 16px;border-radius:999px;white-space:nowrap;opacity:0;transition:all .25s;z-index:400;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ================= Keyboard ================= */
.kb{position:absolute;left:0;right:0;bottom:0;z-index:260;background:#D1D4DA;padding:8px 3px 0;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);user-select:none}
.kb.open{transform:none}
.kb .rows{display:flex;flex-direction:column;gap:12px}
.key{height:42px;border-radius:6px;background:#fff;box-shadow:0 1px 0 #8C8E93;display:flex;align-items:center;justify-content:center;font-size:21px;color:#111;cursor:pointer}
.key.fn{background:#ABB1BC;font-size:15px}.key.pressed{background:#B9BDC5}
.key.ret{background:var(--brand);color:#fff;font-size:15px;font-weight:700}.key.ret.off{background:#ABB1BC;color:#111;font-weight:400}
.caret{display:inline-block;width:2px;height:16px;background:var(--brand);margin-left:1px;vertical-align:-3px;animation:blink 1s steps(1) infinite}
.caret.hidden{display:none}
@keyframes blink{50%{opacity:0}}

/* ================= Home ================= */
.h-head{display:flex;align-items:center;justify-content:space-between;padding:10px 24px}
.h-logo{font-size:21px;font-weight:900;color:var(--brand);letter-spacing:-.3px}
.bell{position:relative;width:44px;height:44px;display:flex;align-items:center;justify-content:center}
.bell i{position:absolute;top:9px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--brand)}
.h-main{padding:16px 24px 10px;display:flex;flex-direction:column;gap:15px}
.badge-driving{background:var(--greenbg);color:var(--green)}.badge-parking{background:var(--bluebg);color:var(--blue)}
.sbadge{display:inline-flex;align-items:center;height:19px;padding:0 7px;border-radius:5px;font-size:11px}
.evcard{border-radius:16px;background:var(--ink);padding:15px 25px;display:flex;flex-direction:column;gap:9px;cursor:pointer;transition:opacity .2s}
.qnav{display:grid;grid-template-columns:repeat(3,1fr)}
.qnav>div{display:flex;flex-direction:column;align-items:center;gap:5px;padding:6px 0;cursor:pointer}
.qnav>div+div{border-left:1px solid var(--line)}
.ai{font-size:10px;font-weight:900;color:#fff;background:var(--brand);border-radius:4px;padding:0 3px;line-height:14px}
.chat{height:52px;border-radius:40px;background:rgba(255,255,255,.95);border:1px solid #DCE1E7;box-shadow:0 8px 24px rgba(73,119,200,.05);display:flex;align-items:center;gap:10px;padding:0 10px 0 16px;cursor:text}
.score{border-radius:14px;background:var(--peach);padding:26px 20px;display:flex;align-items:center;gap:12px;cursor:pointer}
.f-row{display:flex;align-items:center;gap:18px;padding:20px 0;border-bottom:1px solid var(--line);cursor:pointer}
.f-row .ic{width:24px;display:flex;justify-content:center;flex-shrink:0}
.devgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.devgrid>div{height:85px;border-radius:12px;background:#fff;border:1px solid #D4DBE8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-size:12px;font-weight:700;cursor:pointer}

/* ================= Gachibom ================= */
.gb-head{display:flex;align-items:center;justify-content:space-between;padding:10px 16px}
.gb-act{font-size:13px;font-weight:700;color:var(--orange);background:var(--peach2);border-radius:10px;padding:9px 12px}
.search{margin:4px 16px 0;height:42px;border-radius:12px;background:#EEF1F5;display:flex;align-items:center;gap:8px;padding:0 14px;font-size:14px;cursor:pointer}
.map{position:absolute;left:0;right:0;top:0;bottom:0;overflow:hidden;background:#F1EFE8}
.map svg{position:absolute;inset:0}
.mpin{position:absolute;transform:translate(-50%,-100%);background:var(--ink);color:#fff;font-size:12px;font-weight:700;border-radius:999px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.mpin:after{content:'';position:absolute;left:50%;bottom:-7px;width:7px;height:7px;border-radius:50%;background:#111;transform:translateX(-50%)}
.mylo{position:absolute;width:44px;height:44px;border-radius:50%;background:rgba(74,128,255,.18);display:flex;align-items:center;justify-content:center}
.mylo i{width:14px;height:14px;border-radius:50%;background:#3B6FF5;border:2px solid #fff}
.mapbtn{position:absolute;left:16px;width:42px;height:42px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.12);display:flex;align-items:center;justify-content:center;cursor:pointer}
.gsheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:20px 20px 0 0;box-shadow:0 -6px 20px rgba(0,0,0,.06);padding:8px 20px 112px}
.handle{width:44px;height:5px;border-radius:9px;background:#D5D9DF;margin:0 auto 14px;cursor:grab;touch-action:none}
.handle-hit{padding:6px 0 4px;touch-action:none;cursor:grab}
.fab{position:absolute;right:16px;z-index:170;height:50px;padding:0 20px;border-radius:14px;background:var(--orange);color:#fff;font-weight:700;font-size:15px;display:flex;align-items:center;gap:6px;box-shadow:0 6px 16px rgba(234,88,12,.3);cursor:pointer;transition:background .15s}
.fab.open{background:#fff;color:var(--ink);box-shadow:0 6px 16px rgba(0,0,0,.15)}
.fabmenu{position:absolute;right:16px;z-index:170;background:#fff;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.18);overflow:hidden;min-width:200px;animation:pop .16s ease-out;transform-origin:bottom right}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
.fabmenu div{display:flex;align-items:center;gap:12px;padding:15px 18px;font-size:15px;font-weight:700;cursor:pointer}
.fabmenu div+div{border-top:1px solid var(--line2)}
.fabmenu small{display:block;font-size:12px;font-weight:400;color:var(--sub)}
.gitem{display:flex;gap:12px;padding:18px 0;border-bottom:1px solid var(--line2);cursor:pointer}
.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:4px 10px;margin-bottom:8px}
.t-help{background:#FFEDE5;color:#E0480B}.t-share{background:var(--bluebg);color:#2F62C9}.t-db{background:var(--greenbg);color:var(--green)}
.gimg{width:72px;height:72px;border-radius:10px;flex-shrink:0;background:linear-gradient(135deg,#9AA7B8,#5D6B7E)}
</style>
</head>
<body>
<div class="stage">
 <div class="device">
  <div id="screen" class="screen">
   <div class="island"></div>
   <div id="pages"></div>
   <nav id="tabbar" class="tabbar"><div class="wrap"><div class="inner" id="tabInner"></div></div></nav>
   <div id="kb" class="kb" aria-hidden="true"><div class="rows" id="kbRows"></div><div style="height:66px;display:flex;align-items:flex-start;justify-content:space-between;padding:14px 24px 0"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#3A3D42" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3Z"/></svg><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#3A3D42" stroke-width="1.6" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg></div></div>
   <div id="layer"></div>
   <div id="toast" class="toast"></div>
   <div class="hindi"></div>
  </div>
 </div>
</div>

<script>
/* =========================================================
   FINE Alaseo 앱 프로토타입 (피그마 01_화면정의 기준)
   - 탭 루트(홈/보관함/가치봄/내 차 관리/더보기): 하단 탭바 노출, 뒤로가기 없음
   - 두 번째 뎁스부터: 탭바 숨김, 헤더 뒤로가기
   ========================================================= */
const $=s=>document.querySelector(s);
const ICON={
 back:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#20262D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>',
 chev:'<svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="#626B76" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6.75 4.5 11.25 9l-4.5 4.5"/></svg>',
 bell:'<svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="#20262D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 14.67V10.08a5.5 5.5 0 0 1 11 0v4.59l1.38 1.83H4.13l1.37-1.83Z"/><path d="M9.17 18.79a1.83 1.83 0 0 0 3.66 0"/></svg>',
 car:(c='#20262D')=>`<svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="${c}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.58 10.08 6.05 6.05a1.9 1.9 0 0 1 1.74-1.19h6.42a1.9 1.9 0 0 1 1.74 1.19l1.47 4.03"/><rect x="2.75" y="10.08" width="16.5" height="5.5" rx="1.83"/><path d="M5.96 15.58v1.84M16.04 15.58v1.84"/><circle cx="6.87" cy="12.83" r=".73"/><circle cx="15.12" cy="12.83" r=".73"/></svg>`,
 folder:'<svg width="22" height="23" viewBox="0 0 22 23" fill="none" stroke="#20262D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6.38C3 5.62 3.62 5 4.38 5H8.5l1.83 2.02h7.8c.76 0 1.37.61 1.37 1.37V16c0 .76-.61 1.38-1.37 1.38H4.38C3.62 17.38 3 16.76 3 16V6.38Z"/></svg>',
 chart:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#334259" stroke-width="1.875"><path d="M3 5V21H22M7 18V13M12 18V9M17 18V6"/></svg>',
 pin:'<svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="#246142" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 19.25s-5.96-5.13-5.96-10.08a5.96 5.96 0 0 1 11.92 0c0 4.95-5.96 10.08-5.96 10.08Z"/><circle cx="11" cy="9.17" r="2.02"/></svg>',

const S={}; let stack=[{id:'home'}];
function cur(){return stack[stack.length-1]}
function go(id,p){closeAll();stack.push({id,p:p||{}});render('push')}
function back(){closeAll();if(stack.length>1){const c=cur(),d=S[c.id];if(d&&d.guard&&d.guard()===false)return;stack.pop();render('pop')}}
function tab(id){closeAll();if(id==='mycar'&&!st.mycarSetup){stack=[{id:'mycarSetup',p:{fromTab:true,prev:stack.slice()}}];render('fade');return}stack=[{id}];render('fade')}
function render(dir){const c=cur(),d=S[c.id];const el=document.createElement('div');el.className='page '+(d.cls||'')+' '+(dir==='push'?'enter':dir==='pop'?'enter-back':'fade');
 el.innerHTML=d.render(c.p||{});const host=$('#pages');host.innerHTML='';host.appendChild(el);
 const tb=$('#tabbar');if(d.tab){tb.classList.add('show');drawTabs(d.tab)}else tb.classList.remove('show');
 if(d.mount)d.mount(el,c.p||{});}
function drawTabs(on){$('#tabInner').innerHTML=TABS.map(t=>`<div class="t ${t.id===on?'on':''}" data-tab="${t.id}">${t.icon}<span>${t.label}</span></div>`).join('')}
const hdr=(title,o={})=>`<div class="hdr ${o.big?'big':''}">${o.noBack?'':`<button class="backb" data-back aria-label="뒤로가기">${ICON.back}</button>`}<div class="title">${title}</div>${o.right||''}</div>`;

function closeAll(){$('#layer').innerHTML='';closeKb(true)}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),1700)}
function modal({title,q,body,cancel='취소',ok='확인',okCls='mb-ok',onOk,onCancel,single}){
 $('#layer').innerHTML=`<div class="dim" data-dim><div class="modal" onclick="event.stopPropagation()">${title?`<h3>${title}</h3>`:''}${q?`<div class="q">${q}</div>`:''}${body?`<div class="b">${body}</div>`:''}<div class="btns">${single?'':`<button class="mb-cancel" id="mCancel">${cancel}</button>`}<button class="${okCls}" id="mOk">${ok}</button></div></div></div>`;
 $('#mOk').onclick=()=>{$('#layer').innerHTML='';onOk&&onOk()};const c=$('#mCancel');if(c)c.onclick=()=>{$('#layer').innerHTML='';onCancel&&onCancel()};
 $('[data-dim]').onclick=()=>{$('#layer').innerHTML='';onCancel&&onCancel()};}
function sheet(html,onMount){$('#layer').innerHTML=`<div class="dim sheet" data-dim><div class="sheetbox" onclick="event.stopPropagation()"><div class="grab"></div>${html}</div></div>`;$('[data-dim]').onclick=()=>{$('#layer').innerHTML=''};onMount&&onMount($('#layer'))}

 if(t.dataset.toast){toast(t.dataset.toast)}});
